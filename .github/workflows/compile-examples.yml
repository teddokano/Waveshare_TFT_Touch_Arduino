name: Compile examples

# Compiles every example sketch against each board this library has
# been verified on, catching build breaks (e.g. the D10-style pin
# macros that only exist on some 32-bit cores and not on classic AVR)
# without needing real hardware attached to CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: "UNO R3 (arduino:avr)"
            fqbn: "arduino:avr:uno"
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: SD
            sketch-paths: |
              - examples

          - name: "UNO R4 Minima (arduino:renesas_uno)"
            fqbn: "arduino:renesas_uno:minima"
            platforms: |
              - name: arduino:renesas_uno
            libraries: |
              - source-path: ./
              - name: SD
            sketch-paths: |
              - examples

          - name: "FRDM-MCXA153 (nxp:mcx / mcx-arduino-core)"
            fqbn: "nxp:mcx:frdm_mcxa153"
            platforms: |
              - name: nxp:mcx
                source-url: https://raw.githubusercontent.com/teddokano/mcx-arduino-core/main/package_nxp_mcx_index.json
            libraries: |
              - source-path: ./
            # SDBitmapViewer is excluded here: the standard SD
            # library's low-level SdFat backend references bare
            # MOSI/MISO/SCK pin macros that mcx-arduino-core doesn't
            # define (it only provides prefixed equivalents like
            # SPI_MOSI) -- a gap in that core, not something to work
            # around from this library.
            sketch-paths: |
              - examples/TouchPaint
              - examples/GraphicsPrimitivesDemo
              - examples/TouchCalibration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile all examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          sketch-paths: ${{ matrix.board.sketch-paths }}
